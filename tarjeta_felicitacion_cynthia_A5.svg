  </text>

  <!-- Floritura final inferior -->
  <g transform="translate(874, 2170)">
    <path d="M -140 0 Q -70 -15, 0 0 Q 70 -15, 140 0" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-6" r="6" fill="#E4007C" />
    <circle cx="-140" cy="0" r="4" fill="#D4AF37" />
    <circle cx="140" cy="0" r="4" fill="#D4AF37" />
