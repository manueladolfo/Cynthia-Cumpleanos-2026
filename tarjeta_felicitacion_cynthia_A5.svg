    </text>
  </g>

  <!-- Mensaje de amor final -->
  <text x="874" y="2020" font-family="'Great Vibes', 'Brush Script MT', 'Georgia', cursive" font-size="68" fill="#881337" text-anchor="middle">
    Hoy celebramos tu vida, tu sonrisa y tu magia.
  </text>
  
  <text x="874" y="2100" font-family="'Georgia', serif" font-style="italic" font-size="34" fill="#374151" text-anchor="middle">
