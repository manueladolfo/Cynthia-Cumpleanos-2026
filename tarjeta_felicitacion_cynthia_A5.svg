
<svg width="1748" height="2480" viewBox="0 0 1748 2480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de fondo suave apergaminaado / marfil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#FFF7F8" />
      <stop offset="100%" stop-color="#FFF0F3" />
    </linearGradient>

    <!-- Gradiente Dorado Lujoso -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#85581A" />
    </linearGradient>

    <!-- Gradiente Rosa Mexicano a Carmesí -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4007C" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Sombra suave para el contenedor del QR -->
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#881337" flood-opacity="0.12" />
    </filter>

    <!-- Sombra para el matasellos central del QR -->
    <filter id="shadowHeart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4C0519" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo General -->
  <rect width="1748" height="2480" fill="url(#bgGrad)" />

  <!-- Marco Exterior Doble (Dorado y Carmesí) -->
  <rect x="60" y="60" width="1628" height="2360" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
  <rect x="76" y="76" width="1596" height="2328" rx="28" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <rect x="92" y="92" width="1564" height="2296" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- ========================================== -->
  <!-- ESQUINAS ORNAMENTALES (Estilo Tenango / Floral) -->
  <!-- ========================================== -->
  <!-- Esquina Superior Izquierda -->
  <g transform="translate(115, 115)">
    <path d="M 0 0 C 45 10, 85 45, 95 90 C 80 80, 50 65, 0 65 Z" fill="#2D6A4F" />
    <path d="M 0 0 C 10 45, 45 85, 90 95 C 80 80, 65 50, 65 0 Z" fill="#00A896" />
    <circle cx="28" cy="28" r="14" fill="#E4007C" />
    <circle cx="28" cy="28" r="7" fill="#FFB703" />
    <circle cx="85" cy="18" r="8" fill="#FB8500" />
    <circle cx="18" cy="85" r="8" fill="#FB8500" />
  </g>

  <!-- Esquina Superior Derecha -->
  <g transform="translate(1633, 115) scale(-1, 1)">
    <path d="M 0 0 C 45 10, 85 45, 95 90 C 80 80, 50 65, 0 65 Z" fill="#2D6A4F" />
    <path d="M 0 0 C 10 45, 45 85, 90 95 C 80 80, 65 50, 65 0 Z" fill="#00A896" />
    <circle cx="28" cy="28" r="14" fill="#E4007C" />
    <circle cx="28" cy="28" r="7" fill="#FFB703" />
    <circle cx="85" cy="18" r="8" fill="#FB8500" />
    <circle cx="18" cy="85" r="8" fill="#FB8500" />
  </g>

  <!-- Esquina Inferior Izquierda -->
  <g transform="translate(115, 2365) scale(1, -1)">
    <path d="M 0 0 C 45 10, 85 45, 95 90 C 80 80, 50 65, 0 65 Z" fill="#2D6A4F" />
    <path d="M 0 0 C 10 45, 45 85, 90 95 C 80 80, 65 50, 65 0 Z" fill="#00A896" />
    <circle cx="28" cy="28" r="14" fill="#E4007C" />
    <circle cx="28" cy="28" r="7" fill="#FFB703" />
    <circle cx="85" cy="18" r="8" fill="#FB8500" />
    <circle cx="18" cy="85" r="8" fill="#FB8500" />
  </g>

  <!-- Esquina Inferior Derecha -->
  <g transform="translate(1633, 2365) scale(-1, -1)">
    <path d="M 0 0 C 45 10, 85 45, 95 90 C 80 80, 50 65, 0 65 Z" fill="#2D6A4F" />
    <path d="M 0 0 C 10 45, 45 85, 90 95 C 80 80, 65 50, 65 0 Z" fill="#00A896" />
    <circle cx="28" cy="28" r="14" fill="#E4007C" />
    <circle cx="28" cy="28" r="7" fill="#FFB703" />
    <circle cx="85" cy="18" r="8" fill="#FB8500" />
    <circle cx="18" cy="85" r="8" fill="#FB8500" />
  </g>

  <!-- ========================================== -->
  <!-- CABECERA DE LA TARJETA -->
  <!-- ========================================== -->
  <!-- Insignia Festiva Superior -->
  <g transform="translate(874, 235)">
    <!-- Marco de la cápsula -->
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2.5" stroke-dasharray="6 4" />
    <text x="0" y="11" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#9F1239" letter-spacing="4" text-anchor="middle">
      ✨ 13 DE SEPTIEMBRE DE 2026 ✨
    </text>
  </g>

  <!-- Titular Festivo Principal -->
  <text x="874" y="365" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="64" font-weight="bold" fill="#881337" text-anchor="middle" letter-spacing="2">
    ¡Feliz Cumpleaños!
  </text>

  <!-- Gran Nombre: Cynthia con guirnalda decorativa -->
  <g transform="translate(874, 540)">
    <!-- Flor central estilo Tenango sobre el nombre -->
    <g transform="translate(0, -95)">
      <circle cx="0" cy="0" r="16" fill="#FFB703" />
      <circle cx="0" cy="0" r="9" fill="#E4007C" />
      <circle cx="0" cy="0" r="4" fill="#FFF" />
      <!-- Pétalos -->
      <path d="M 0 -16 C -8 -30, 8 -30, 0 -16 Z" fill="#E4007C" />
      <path d="M 0 16 C -8 30, 8 30, 0 16 Z" fill="#E4007C" />
      <path d="M -16 0 C -30 -8, -30 8, -16 0 Z" fill="#00A896" />
      <path d="M 16 0 C 30 -8, 30 8, 16 0 Z" fill="#00A896" />
      <path d="M -12 -12 C -24 -24, -14 -28, -12 -12 Z" fill="#FB8500" />
      <path d="M 12 -12 C 24 -24, 14 -28, 12 -12 Z" fill="#FB8500" />
      <path d="M -12 12 C -24 24, -14 28, -12 12 Z" fill="#FB8500" />
      <path d="M 12 12 C 24 24, 14 28, 12 12 Z" fill="#FB8500" />
      <!-- Ramitas bordadas a los lados -->
      <path d="M -35 0 Q -120 -20, -180 10" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round" />
      <path d="M 35 0 Q 120 -20, 180 10" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round" />
      <!-- Hojas -->
      <circle cx="-110" cy="-14" r="8" fill="#E4007C" />
      <circle cx="-160" cy="2" r="7" fill="#FFB703" />
      <circle cx="110" cy="-14" r="8" fill="#E4007C" />
      <circle cx="160" cy="2" r="7" fill="#FFB703" />
    </g>

    <!-- Nombre 'Cynthia' en caligrafía majestuosa -->
    <text x="0" y="30" font-family="'Great Vibes', 'Parisienne', 'Brush Script MT', 'Georgia', cursive" font-size="140" font-weight="normal" fill="#0B4F6C" text-anchor="middle">
      Cynthia
    </text>

    <!-- Línea decorativa inferior con corazón -->
    <path d="M -220 70 Q -80 85, -35 70" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 220 70 Q 80 85, 35 70" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="77" font-family="'Georgia', serif" font-size="28" fill="#E11D48" text-anchor="middle">❦</text>
  </g>

  <!-- Mensaje de Invitación a la Experiencia -->
  <text x="874" y="730" font-family="'Georgia', serif" font-style="italic" font-size="38" fill="#4B5563" text-anchor="middle">
    Tengo una sorpresa preparada para ti...
  </text>
  <text x="874" y="785" font-family="'Georgia', serif" font-size="32" font-weight="bold" fill="#881337" text-anchor="middle">
    Un recorrido lleno de recuerdos y momentos únicos juntos.
  </text>

  <!-- Florituras decorativas antes del QR -->
  <g transform="translate(874, 855)">
    <line x1="-280" y1="0" x2="-40" y2="0" stroke="#E5E7EB" stroke-width="2" />
    <text x="0" y="8" font-family="'Georgia', serif" font-size="28" fill="#BE123C" text-anchor="middle">✨ ✉️ ✨</text>
    <line x1="40" y1="0" x2="280" y2="0" stroke="#E5E7EB" stroke-width="2" />
  </g>

  <!-- Llamada a la acción superior del QR -->
  <text x="874" y="935" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#1F2937" text-anchor="middle">
    Abre la cámara de tu móvil y escanea este código:
  </text>
  <text x="874" y="980" font-family="'Georgia', serif" font-style="italic" font-size="27" fill="#6B7280" text-anchor="middle">
    (Te llevará directo a tu regalo digital interactivo)
  </text>

  <!-- ========================================== -->
  <!-- TARJETA CONTENEDORA DEL CÓDIGO QR -->
  <!-- ========================================== -->
  <g transform="translate(484, 1030)" filter="url(#shadowCard)">
    <!-- Tarjeta blanca con borde dorado de lujo -->
    <rect x="0" y="0" width="780" height="780" rx="48" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="5" />
    <rect x="16" y="16" width="748" height="748" rx="36" fill="none" stroke="#FFE4E6" stroke-width="2.5" />

    <!-- Marcadores ornamentales en las 4 esquinas interiores de la caja del QR -->
    <circle cx="36" cy="36" r="6" fill="#D4AF37" />
    <circle cx="744" cy="36" r="6" fill="#D4AF37" />
    <circle cx="36" cy="744" r="6" fill="#D4AF37" />
    <circle cx="744" cy="744" r="6" fill="#D4AF37" />

    <!-- CÓDIGO QR REAL ESCANEABLE -->
    <g transform="translate(65, 65)">
      <svg viewBox="0 0 39 39" width="650" height="650">
        <path fill="#FFFFFF" d="M0 0h39v39H0z"/><path stroke="#881337" d="M1 1.5h7m2 0h7m2 0h2m1 0h1m3 0h2m3 0h7M1 2.5h1m5 0h1m3 0h3m1 0h1m1 0h1m2 0h1m3 0h1m1 0h1m2 0h1m1 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h1m3 0h2m2 0h1m1 0h2m1 0h2m2 0h3m2 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h2m5 0h2m1 0h1m2 0h1m3 0h1m2 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m2 0h1m1 0h2m1 0h3m1 0h1m5 0h2m4 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m2 0h2m3 0h1m1 0h1m4 0h2m2 0h2m3 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 8.5h1m1 0h1m3 0h5m2 0h2m2 0h3M4 9.5h2m1 0h2m3 0h3m1 0h1m3 0h2m2 0h4m6 0h2M3 10.5h4m1 0h2m1 0h1m2 0h4m2 0h1m1 0h3m1 0h2m1 0h1m3 0h2m1 0h1M1 11.5h2m3 0h2m1 0h2m1 0h2m1 0h1m2 0h1m4 0h1m1 0h2m1 0h4m1 0h5M2 12.5h1m1 0h1m3 0h1m1 0h1m1 0h1m1 0h1m2 0h1m1 0h3m1 0h2m2 0h1m1 0h3m2 0h2m1 0h1M1 13.5h1m5 0h1m2 0h1m4 0h3m2 0h1m3 0h2m2 0h2m1 0h1m2 0h1m2 0h1M1 14.5h1m1 0h1m4 0h1m2 0h4m2 0h1m2 0h2m1 0h3m1 0h4m1 0h2m1 0h2M1 15.5h1m1 0h1m2 0h4m5 0h1m1 0h1m2 0h1m1 0h2m2 0h4m1 0h7M1 16.5h3m1 0h2m2 0h6m2 0h2m5 0h1m3 0h1m1 0h2m1 0h3M2 17.5h1m1 0h1m2 0h3m3 0h8m1 0h1m3 0h1m1 0h4m3 0h1M4 18.5h2m3 0h2m1 0h1m2 0h1m1 0h4m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h3M1 19.5h2m1 0h2m1 0h1m1 0h1m3 0h1m1 0h2m1 0h1m1 0h1m1 0h1m2 0h1m1 0h2m2 0h1m1 0h3m1 0h1M1 20.5h4m1 0h1m1 0h2m4 0h2m2 0h6m2 0h3m3 0h1m1 0h1M1 21.5h3m2 0h3m15 0h2m1 0h3m1 0h1m1 0h2m1 0h2M1 22.5h2m1 0h1m1 0h1m1 0h1m1 0h1m1 0h4m1 0h1m1 0h4m2 0h1m1 0h3m2 0h2m1 0h1M2 23.5h1m1 0h1m2 0h1m2 0h2m1 0h1m1 0h1m2 0h2m2 0h3m2 0h2m4 0h5M1 24.5h1m2 0h1m1 0h1m4 0h1m2 0h3m1 0h1m2 0h3m1 0h1m1 0h3m2 0h1m2 0h3M1 25.5h3m1 0h4m1 0h1m1 0h6m1 0h4m3 0h2m1 0h3M1 26.5h1m2 0h2m2 0h2m1 0h1m1 0h2m1 0h5m2 0h1m1 0h2m2 0h1m1 0h1m1 0h1M1 27.5h4m1 0h2m1 0h3m1 0h1m1 0h3m1 0h3m1 0h1m5 0h1m1 0h2m2 0h3M1 28.5h1m1 0h1m2 0h1m4 0h1m1 0h2m2 0h2m2 0h2m2 0h1m2 0h1m1 0h1m2 0h3m1 0h1M1 29.5h1m3 0h1m1 0h2m1 0h1m1 0h2m1 0h2m1 0h1m2 0h6m2 0h5m1 0h1M9 30.5h1m1 0h1m1 0h1m1 0h1m2 0h2m2 0h1m4 0h3m3 0h4M1 31.5h7m1 0h5m1 0h1m2 0h1m3 0h3m1 0h2m1 0h1m1 0h1m1 0h3m1 0h1M1 32.5h1m5 0h1m6 0h3m1 0h1m1 0h1m5 0h4m3 0h2m1 0h2M1 33.5h1m1 0h3m1 0h1m1 0h2m3 0h1m3 0h1m2 0h1m1 0h1m1 0h1m1 0h7M1 34.5h1m1 0h3m1 0h1m1 0h1m4 0h1m1 0h5m1 0h1m4 0h1m3 0h2M1 35.5h1m1 0h3m1 0h1m2 0h1m1 0h3m1 0h2m3 0h1m3 0h3m1 0h1m3 0h2m1 0h2M1 36.5h1m5 0h1m2 0h1m1 0h2m2 0h2m2 0h1m1 0h1m4 0h1m6 0h4M1 37.5h7m4 0h2m3 0h1m1 0h2m2 0h1m1 0h1m3 0h1m1 0h4m2 0h1"/>
      </svg>
    </g>

    <!-- Corazón / Emblema decorativo centrado en el QR (el nivel H tolera hasta 30% sin perder lectura) -->
    <g transform="translate(390, 390)" filter="url(#shadowHeart)">
      <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#881337" stroke-width="4" />
      <circle cx="0" cy="0" r="42" fill="#E11D48" />
      <!-- Corazón blanco en el centro -->
      <path d="M 0 -12 C -6 -24, -22 -18, -20 -2 C -18 10, -2 18, 0 24 C 2 18, 18 10, 20 -2 C 22 -18, 6 -24, 0 -12 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- PIE DE TARJETA: ENLACE TEXTUAL Y DEDICATORIA -->
  <!-- ========================================== -->
  <!-- Enlace escrito por si prefieren teclearlo -->
  <g transform="translate(874, 1900)">
    <rect x="-310" y="-24" width="620" height="48" rx="24" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5" />
    <text x="0" y="9" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#9F1239" text-anchor="middle">
